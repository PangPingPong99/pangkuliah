    * {

    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes pkConfettiPop {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5);
      }
      70% {
        opacity: 1;
        transform: translate(var(--tx), var(--ty)) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--tx) * 1.3), calc(var(--ty) * 1.3)) scale(0.4);
      }
    }

    .pk-confetti-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      animation: pkConfettiPop 750ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pkCheckBounce {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .pk-check-bounce {
      animation: pkCheckBounce 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pkSlideUpFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pk-animate-in {
      animation: pkSlideUpFade 260ms ease-out forwards;
    }

    function safeLoadArray(key, fallback) {
      try {
        if (typeof window === 'undefined' || !window.localStorage) {
          return fallback;
        }
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return fallback;
        return parsed.filter((item) => item && typeof item === 'object');
      } catch (error) {
        console.warn(`PangKuliah: Gagal memuat ${key}, menggunakan data awal.`, error);
        return fallback;
      }
    }

    function safeLoadObject(key, fallback) {
      try {
        if (typeof window === 'undefined' || !window.localStorage) {
          return fallback;
        }
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          return fallback;
        }
        return { ...fallback, ...parsed };
      } catch (error) {
        console.warn(`PangKuliah: Gagal memuat ${key}, menggunakan default.`, error);
        return fallback;
      }
    }

    function safeLoadBoolean(key, fallback) {
      try {
        if (typeof window === 'undefined' || !window.localStorage) {
          return fallback;
        }
        const raw = window.localStorage.getItem(key);
        if (raw === null) return fallback;
        return raw === 'true';
      } catch (error) {
        return fallback;
      }
    }

    function safeLoadString(key, fallback) {
      try {
        if (typeof window === 'undefined' || !window.localStorage) {
          return fallback;
        }
        const raw = window.localStorage.getItem(key);
        return typeof raw === 'string' && raw.length > 0 ? raw : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function copyToClipboardSafe(text) {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => {
          fallbackExecCopy(text);
        });
      } else {
        fallbackExecCopy(text);
      }
    }

    function fallbackExecCopy(text) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
      } catch (err) {
        console.warn('Gagal menyalin ke clipboard:', err);
      }
    }

    function parseTimeToSeconds(timeStr) {
      const parts = String(timeStr || '00:00').split(':').map(Number);
      const h = Number.isFinite(parts[0]) ? parts[0] : 0;
      const m = Number.isFinite(parts[1]) ? parts[1] : 0;
      return h * 3600 + m * 60;
    }

    function formatCountdown(totalSeconds) {
      const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) {
        return `${hrs}j ${pad(mins)}m ${pad(secs)}d`;
      }
      return `${pad(mins)}m ${pad(secs)}d`;
    }

    function formatRelativeDue(dueIso, nowDate) {
      const due = new Date(dueIso);
      if (Number.isNaN(due.getTime())) return 'Tenggat belum diatur';
      const diffMs = due.getTime() - nowDate.getTime();
      const diffMins = Math.round(diffMs / 60000);

      if (diffMins < 0) {
        const absMins = Math.abs(diffMins);
        if (absMins < 60) return `Terlewat ${absMins} menit`;
        const absHours = Math.floor(absMins / 60);
        if (absHours < 24) return `Terlewat ${absHours} jam`;
        return `Terlewat ${Math.floor(absHours / 24)} hari`;
      }

      if (diffMins < 60) return `${diffMins} menit lagi`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) {
        const remMins = diffMins % 60;
        return remMins > 0 ? `${diffHours} jam ${remMins}m lagi` : `${diffHours} jam lagi`;
      }
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return 'Besok';
      return `${diffDays} hari lagi`;
    }

    function formatDateTimeID(isoString) {
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return '-';
      const dayName = ALL_DAYS_MAP[d.getDay()] || '';
      const dateNum = d.getDate();
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const monthName = months[d.getMonth()] || '';
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${dayName}, ${dateNum} ${monthName} • ${hh}:${mm}`;
    }

    function playGentleDing() {
      try {
        if (typeof window === 'undefined') return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const now = ctx.currentTime;
        const notes = [
          { freq: 1046.5, start: 0, duration: 0.42, gain: 0.14 },
          { freq: 1318.51, start: 0.14, duration: 0.58, gain: 0.12 },
        ];

        notes.forEach((n) => {
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.freq, now + n.start);

          gainNode.gain.setValueAtTime(0.0001, now + n.start);
          gainNode.gain.exponentialRampToValueAtTime(n.gain, now + n.start + 0.025);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.duration);

          osc.connect(gainNode);
          gainNode.connect(ctx.destination);

          osc.start(now + n.start);
          osc.stop(now + n.start + n.duration + 0.04);
        });

        setTimeout(() => {
          ctx.close().catch(() => {});
        }, 1000);
      } catch (error) {
        console.warn('PangKuliah: Audio ding tidak dapat diputar:', error);
      }
    }

    function triggerBrowserNotification({ title, body, tag }) {
      try {
        if (typeof window === 'undefined' || !('Notification' in window)) return false;
        if (Notification.permission === 'granted') {
          const notif = new Notification(title, {
            body,
            tag: tag || `pangkuliah-${Date.now()}`,
          });
          setTimeout(() => {
            try {
              notif.close();
            } catch (e) {}
          }, 7000);
          return true;
        }
      } catch (error) {
        console.warn('PangKuliah: Gagal menampilkan Browser Notification:', error);
      }
      return false;
    }

    function formatGoogleCalendarDate(dateObj) {
      const d = dateObj instanceof Date && !Number.isNaN(dateObj.getTime()) ? dateObj : new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(
        d.getHours()
      )}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }

    function buildGoogleCalendarUrl({ title, startDate, endDate, details = '', location = '' }) {
      const startStr = formatGoogleCalendarDate(startDate);
      const endStr = formatGoogleCalendarDate(endDate || new Date(startDate.getTime() + 30 * 60000));
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title || 'Pengingat PangKuliah',
        dates: `${startStr}/${endStr}`,
        details,
        location,
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function buildTaskGoogleCalendarUrl(task, course) {
      const dueDate = new Date(task?.dueAt || Date.now());
      const validDue = Number.isNaN(dueDate.getTime()) ? new Date() : dueDate;
      const endDate = new Date(validDue.getTime() + 30 * 60 * 1000);
      const courseLabel = course ? `${course.code} — ${course.name}` : 'Mata Kuliah';
      const detailsLines = [
        `Mata Kuliah: ${courseLabel}`,
        `Tenggat Waktu: ${formatDateTimeID(validDue.toISOString())}`,
        task?.notes ? `Catatan: ${task.notes}` : null,
        'Dibuat otomatis dari PangKuliah ✨',
      ].filter(Boolean);

      return buildGoogleCalendarUrl({
        title: `[Tugas] ${task?.title || 'Tugas Kuliah'}`,
        startDate: validDue,
        endDate,
        details: detailsLines.join('\n'),
        location: course?.defaultLocation || '',
      });
    }

    function buildScheduleGoogleCalendarUrl(schedule, course, referenceDate) {
      const ref =
        referenceDate instanceof Date && !Number.isNaN(referenceDate.getTime())
          ? new Date(referenceDate)
          : new Date();
      const targetDayIdx = ALL_DAYS_MAP.indexOf(schedule?.day || 'Senin');
      const validTargetIdx = targetDayIdx >= 0 ? targetDayIdx : 1;
      let daysAhead = (validTargetIdx - ref.getDay() + 7) % 7;

      const [startH, startM] = String(schedule?.startTime || '08:00').split(':').map(Number);
      const [endH, endM] = String(schedule?.endTime || '09:40').split(':').map(Number);

      const startDate = new Date(ref);
      startDate.setDate(ref.getDate() + daysAhead);
      startDate.setHours(Number.isFinite(startH) ? startH : 8, Number.isFinite(startM) ? startM : 0, 0, 0);

      const endDate = new Date(startDate);
      endDate.setHours(Number.isFinite(endH) ? endH : 9, Number.isFinite(endM) ? endM : 40, 0, 0);

      if (daysAhead === 0 && endDate.getTime() < ref.getTime()) {
        startDate.setDate(startDate.getDate() + 7);
        endDate.setDate(endDate.getDate() + 7);
      }

      const courseName = course?.name || 'Mata Kuliah';
      const courseCode = course?.code || 'MK';
      const locationText = schedule?.location || course?.defaultLocation || '';
      const detailsLines = [
        `Mata Kuliah: ${courseName} (${courseCode})`,
        `Dosen Pengampu: ${course?.lecturer || '-'}`,
        `Bobot: ${course?.sks || 3} SKS`,
        `Jadwal: ${schedule?.day || ''}, ${schedule?.startTime || ''} – ${schedule?.endTime || ''} WIB`,
        'Dibuat otomatis dari PangKuliah ✨',
      ];

      return buildGoogleCalendarUrl({
        title: `[Kuliah] ${courseName} (${courseCode})`,
        startDate,
        endDate,
        details: detailsLines.join('\n'),
        location: locationText,
      });
    }

    function CelebrationBurst({ active }) {
      if (!active) return null;
      const particles = [
        { color: '#1DB954', tx: '-28px', ty: '-32px', delay: '0ms' },
        { color: '#7C3AED', tx: '28px', ty: '-30px', delay: '30ms' },
        { color: '#F59E0B', tx: '-34px', ty: '8px', delay: '50ms' },
        { color: '#5865F2', tx: '34px', ty: '10px', delay: '20ms' },
        { color: '#EC4899', tx: '0px', ty: '-38px', delay: '40ms' },
        { color: '#10B981', tx: '16px', ty: '26px', delay: '60ms' },
      ];

      return (
        <div className="pointer-events-none absolute inset-0 flex items-center justify-center z-20">
          {particles.map((p, idx) => (
            <span
              key={idx}
              className="pk-confetti-dot"
              style={{
                backgroundColor: p.color,
                '--tx': p.tx,
                '--ty': p.ty,
                animationDelay: p.delay,
              }}
            />
          ))}
        </div>
      );
    }

      // Interval Detik

      const showToast = useCallback((message, type = 'success') => {

      useEffect(() => {

      }, [toast]);

      // Waktu Virtual Aktif
      const virtualNow = useMemo(() => {
        const deltaMs = Date.now() - simBaseTimestamp;
        if (simMode === 'realtime') {

        return new Date(base.getTime() + deltaMs);
      }, [simMode, simBaseTimestamp, elapsedSinceMount]);

      const activeDayName = ALL_DAYS_MAP[virtualNow.getDay()] || 'Rabu';

      useEffect(() => {
        if (DAYS_OF_WEEK.includes(activeDayName)) {
          setSelectedWeekDay(activeDayName);
        } else {
          setSelectedWeekDay('Senin');
        }
      }, [activeDayName]);

      // Array Data Terproteksi
      const safeCourses = useMemo(
        () => (Array.isArray(courses) && courses.length > 0 ? courses : INITIAL_COURSES),
        [courses]
      );
      const safeSchedules = useMemo(
        () => (Array.isArray(schedules) ? schedules : []),
        [schedules]
      );
      const safeTasks = useMemo(
        () => (Array.isArray(tasks) ? tasks : []),
        [tasks]
      );
      const safeMaterials = useMemo(
        () => (Array.isArray(materials) ? materials : []),
        [materials]
      );

      const courseMap = useMemo(() => {
        const map = {};
        (safeCourses || []).forEach((c) => {
          if (c?.id) map[c.id] = c;
        });
        return map;
      }, [safeCourses]);

      // Total SKS Mahasiswa
      const totalSks = useMemo(
        () => (safeCourses || []).reduce((sum, c) => sum + Number(c?.sks || 0), 0),
        [safeCourses]
      );

      // Jadwal Hari Ini + Status & Countdown
      const todaySchedulesWithStatus = useMemo(() => {
        const currentSec =
          virtualNow.getHours() * 3600 + virtualNow.getMinutes() * 60 + virtualNow.getSeconds();

        return (safeSchedules || [])
          .filter((s) => s?.day === activeDayName)
          .sort((a, b) => parseTimeToSeconds(a?.startTime) - parseTimeToSeconds(b?.startTime))
          .map((item) => {
            const startSec = parseTimeToSeconds(item?.startTime);
            const endSec = Math.max(startSec + 60, parseTimeToSeconds(item?.endTime));
            let status = 'upcoming';
            let progress = 0;
            let countdownSec = 0;

            if (currentSec >= startSec && currentSec < endSec) {
              status = 'ongoing';
              progress = Math.min(
                100,
                Math.max(4, ((currentSec - startSec) / (endSec - startSec)) * 100)
              );
              countdownSec = endSec - currentSec;
            } else if (currentSec < startSec && startSec - currentSec <= 1800) {
              status = 'soon';
              countdownSec = startSec - currentSec;
            } else if (currentSec < startSec) {
              status = 'upcoming';
              countdownSec = startSec - currentSec;
            } else {
              status = 'finished';
            }

            return {
              ...item,
              course: courseMap[item?.courseId] || safeCourses[0] || FALLBACK_COURSE,
              status,
              progress,
              countdownSec,
            };
          });
      }, [safeSchedules, activeDayName, virtualNow, courseMap, safeCourses]);

      // Kartu Hero Spotify "Now Playing"
      const heroClassData = useMemo(() => {
        const ongoing = todaySchedulesWithStatus.find((s) => s?.status === 'ongoing');
        if (ongoing) {
          return {
            mode: 'ongoing',
            badge: 'SEDANG BERLANGSUNG',
            schedule: ongoing,
            progress: ongoing.progress,
            countdownText: `${formatCountdown(ongoing.countdownSec)} tersisa`,
            subtitle: `Selesai pukul ${ongoing.endTime} WIB`,
          };
        }

        const nextToday = todaySchedulesWithStatus.find(
          (s) => s?.status === 'soon' || s?.status === 'upcoming'
        );
        if (nextToday) {
          const waitWindow = 3600;
          const waitProgress = Math.min(
            95,
            Math.max(
              12,
              ((waitWindow - Math.min(waitWindow, nextToday.countdownSec)) / waitWindow) * 100
            )
          );
          return {
            mode: 'next_today',
            badge: nextToday.status === 'soon' ? 'SEGERA DIMULAI' : 'KELAS BERIKUTNYA',
            schedule: nextToday,
            progress: waitProgress,
            countdownText: `Mulai dalam ${formatCountdown(nextToday.countdownSec)}`,
            subtitle: `Hari ini • ${nextToday.startTime} - ${nextToday.endTime}`,
          };
        }

        const todayIdx = ALL_DAYS_MAP.indexOf(activeDayName);
        for (let offset = 1; offset <= 7; offset++) {
          const nextDayName = ALL_DAYS_MAP[(todayIdx + offset) % 7];
          const dayClasses = (safeSchedules || [])
            .filter((s) => s?.day === nextDayName)
            .sort((a, b) => parseTimeToSeconds(a?.startTime) - parseTimeToSeconds(b?.startTime));
          if (dayClasses.length > 0) {
            const firstClass = dayClasses[0];
            return {
              mode: 'next_day',
              badge: `KELAS BERIKUTNYA • ${nextDayName.toUpperCase()}`,
              schedule: {
                ...firstClass,
                course: courseMap[firstClass?.courseId] || safeCourses[0] || FALLBACK_COURSE,
              },
              progress: 0,
              countdownText: `${nextDayName}, ${firstClass.startTime}`,
              subtitle: 'Jadwal hari ini sudah rampung ✨',
            };
          }
        }

        return null;
      }, [todaySchedulesWithStatus, activeDayName, safeSchedules, courseMap, safeCourses]);

      // Pengecekan Berkala Pengingat Tugas & Kelas (15 Menit Sebelum Mulai)
      useEffect(() => {
        if (!remindersEnabled) return;

        (safeTasks || []).forEach((task) => {
          if (!task || task.completed || !task.dueAt) return;
          const dueMs = new Date(task.dueAt).getTime();
          if (Number.isNaN(dueMs)) return;

          const diffMins = (dueMs - virtualNow.getTime()) / 60000;
          const reminderWindow = Number(task.reminderMinutes) || 180;
          const alertKey = `task-${task.id}-${reminderWindow}`;

          if (diffMins > -60 && diffMins <= reminderWindow && !triggeredAlertsRef.current.has(alertKey)) {
            triggeredAlertsRef.current.add(alertKey);
            const course = courseMap[task.courseId];
            const relLabel = formatRelativeDue(task.dueAt, virtualNow);

        (todaySchedulesWithStatus || []).forEach((item) => {
          if (!item || item.status !== 'soon') return;
          if (item.countdownSec > 0 && item.countdownSec <= 900) {
            const classAlertKey = `class-${item.id}-${activeDayName}`;
            if (!triggeredAlertsRef.current.has(classAlertKey)) {
              triggeredAlertsRef.current.add(classAlertKey);
              const minsLeft = Math.max(1, Math.ceil(item.countdownSec / 60));

      // Statistik Tugas & Pengingat
      const taskStats = useMemo(() => {
        const total = safeTasks.length;

        const urgentReminders = safeTasks
          .filter((t) => {
            if (t?.completed || !t?.dueAt) return false;
            const dueMs = new Date(t.dueAt).getTime();
            if (Number.isNaN(dueMs)) return false;
            const diffMins = (dueMs - virtualNow.getTime()) / 60000;
            return diffMins <= (Number(t.reminderMinutes) || 180);
          })
          .sort((a, b) => new Date(a?.dueAt || 0).getTime() - new Date(b?.dueAt || 0).getTime());

        return {
          total,
          completed,
          pending,
          urgentCount: urgentReminders.length,
          percent,
          urgentReminders,

      }, [safeTasks, virtualNow]);

      // Daftar Tugas Terfilter & Terurut Tenggat Otomatis

        return (safeTasks || [])
          .filter((t) => {
            if (taskCourseFilter !== 'all' && t?.courseId !== taskCourseFilter) return false;
            if (taskStatusFilter === 'pending' && t?.completed) return false;
            if (taskStatusFilter === 'completed' && !t?.completed) return false;
            return true;
          })
          .sort((a, b) => {
            if (Boolean(a?.completed) !== Boolean(b?.completed)) {
              return a?.completed ? 1 : -1;

            return new Date(a?.dueAt || 0).getTime() - new Date(b?.dueAt || 0).getTime();

      // Pengelompokan Jumlah Materi per Mata Kuliah & Pencarian Instan

          if (m?.courseId) {
            counts[m.courseId] = (counts[m.courseId] || 0) + 1;

        });
        return counts;
      }, [safeCourses, safeMaterials]);

      const filteredMaterials = useMemo(() => {
        const q = materialSearchQuery.trim().toLowerCase();
        return (safeMaterials || [])
          .filter((m) => {
            if (materialCourseFilter !== 'all' && m?.courseId !== materialCourseFilter) {
              return false;
            }
            if (!q) return true;
            const course = courseMap[m?.courseId];
            const titleMatch = String(m?.title || '').toLowerCase().includes(q);
            const notesMatch = String(m?.notes || '').toLowerCase().includes(q);
            const courseNameMatch = String(course?.name || '').toLowerCase().includes(q);
            const courseCodeMatch = String(course?.code || '').toLowerCase().includes(q);
            const meetingNum = String(m?.meetingNumber || '');
            const meetingMatch =
              `pertemuan ${meetingNum}`.includes(q) || meetingNum === q;
            return titleMatch || notesMatch || courseNameMatch || courseCodeMatch || meetingMatch;
          })
          .sort((a, b) => {
            const meetDiff = Number(b?.meetingNumber || 0) - Number(a?.meetingNumber || 0);
            if (meetDiff !== 0) return meetDiff;
            return new Date(b?.createdAt || 0).getTime() - new Date(a?.createdAt || 0).getTime();

        const target = (safeTasks || []).find((t) => t?.id === taskId);
        if (!target) return;
        const willComplete = !target.completed;

        setTasks((prev) =>
          (prev || []).map((t) => (t?.id === taskId ? { ...t, completed: willComplete } : t))
        );

        if (willComplete) {
          setCelebratingTaskId(taskId);
          setTimeout(() => setCelebratingTaskId(null), 900);

            ENCOURAGING_MESSAGES[Math.floor(Math.random() * ENCOURAGING_MESSAGES.length)];

          const newTask = {

            (prev || []).map((s) => (s?.id === scheduleData.id ? { ...s, ...scheduleData } : s))

            tag: 'pangkuliah-active',

    // ============================================================================
    // SUB-KOMPONEN 1: FORM TAMBAH / EDIT TUGAS CEPAT (FASE 2)
    // ============================================================================

    function QuickTaskForm({
      courses = [],
      nowDate,
      initialTask = null,
      activeTheme,
      onSubmit,
    }) {
      const safeCourses =
        Array.isArray(courses) && courses.length > 0 ? courses : [FALLBACK_COURSE];
      const defaultDue = useMemo(() => {
        if (initialTask?.dueAt) {
          const d = new Date(initialTask.dueAt);
          if (!Number.isNaN(d.getTime())) return toLocalDateTimeInputValue(d);
        }
        const tomorrow = new Date(nowDate.getTime() + 24 * 3600 * 1000);
        tomorrow.setHours(23, 59, 0, 0);
        return toLocalDateTimeInputValue(tomorrow);
      }, [initialTask, nowDate]);

      const [title, setTitle] = useState(initialTask?.title || '');
      const [courseId, setCourseId] = useState(
        initialTask?.courseId || safeCourses[0]?.id || ''
      );
      const [dueAtInput, setDueAtInput] = useState(defaultDue);
      const [reminderMinutes, setReminderMinutes] = useState(
        Number(initialTask?.reminderMinutes) || 180
      );
      const [notes, setNotes] = useState(initialTask?.notes || '');
      const [error, setError] = useState('');

      const inputStyle = {
        backgroundColor: activeTheme.subBg,
        borderColor: activeTheme.border,
        color: activeTheme.textPrimary,
      };

      const applyPreset = (daysToAdd) => {
        const target = new Date(nowDate.getTime() + daysToAdd * 24 * 3600 * 1000);
        target.setHours(23, 59, 0, 0);
        setDueAtInput(toLocalDateTimeInputValue(target));
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) {
          setError('Judul tugasnya diisi dulu ya!');
          return;
        }
        const parsedDate = new Date(dueAtInput);
        if (Number.isNaN(parsedDate.getTime())) {
          setError('Format tanggal & jam tenggat tidak valid.');
          return;
        }
        setError('');
        onSubmit({
          id: initialTask?.id,
          title: title.trim(),
          courseId,
          dueAt: parsedDate.toISOString(),
          reminderMinutes: Number(reminderMinutes),
          notes: notes.trim(),
        });
        if (!initialTask) {
          setTitle('');
          setNotes('');
        }
      };

      return (
        <form onSubmit={handleFormSubmit} className="space-y-4">
          {error && (
            <div className="p-3 rounded-2xl bg-rose-500/15 text-rose-500 text-xs font-bold flex items-center gap-2">
              <AlertCircle className="w-4 h-4 shrink-0" />
              {error}
            </div>
          )}

          <div>
            <label className="block text-xs font-extrabold mb-1.5">Judul Tugas</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="Misal: Laporan Praktikum Modul 4"
              className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
              style={inputStyle}
            />
          </div>

          <div>
            <label className="block text-xs font-extrabold mb-1.5">Mata Kuliah</label>
            <select
              value={courseId}
              onChange={(e) => setCourseId(e.target.value)}
              className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
              style={inputStyle}
            >
              {safeCourses.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.code} — {c.name}
                </option>
              ))}
            </select>
          </div>

          <div>
            <div className="flex items-center justify-between gap-2 flex-wrap mb-1.5">
              <label className="text-xs font-extrabold">Tenggat Waktu</label>
              <div className="flex items-center gap-1 flex-wrap">
                {[
                  { label: 'Hari Ini', days: 0 },
                  { label: 'Besok', days: 1 },
                  { label: '3 Hari Lagi', days: 3 },
                  { label: 'Minggu Depan', days: 7 },
                ].map((p) => (
                  <button
                    key={p.label}
                    type="button"
                    onClick={() => applyPreset(p.days)}
                    className="px-2.5 py-1 rounded-full text-[10px] font-extrabold transition-all hover:opacity-85"
                    style={{
                      backgroundColor: activeTheme.accentSoftBg,
                      color: activeTheme.accentSoftText,
                    }}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>
            <input
              type="datetime-local"
              value={dueAtInput}
              onChange={(e) => setDueAtInput(e.target.value)}
              className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
              style={inputStyle}
            />
          </div>

          <div>
            <label className="block text-xs font-extrabold mb-1.5">Opsi Pengingat</label>
            <div className="grid grid-cols-3 gap-2">
              {REMINDER_OPTIONS.map((opt) => (
                <button
                  key={opt.value}
                  type="button"
                  onClick={() => setReminderMinutes(opt.value)}
                  className="py-2 px-2.5 rounded-full text-xs font-extrabold transition-all"
                  style={
                    Number(reminderMinutes) === opt.value
                      ? {
                          backgroundColor: activeTheme.accent,
                          color: activeTheme.accentText,
                        }
                      : {
                          backgroundColor: activeTheme.subBg,
                          color: activeTheme.textSecondary,
                        }
                  }
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-xs font-extrabold mb-1.5">
              Catatan Singkat (Opsional)
            </label>
            <input
              type="text"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Format PDF, upload di e-Learning..."
              className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-xs sm:text-sm font-medium"
              style={inputStyle}
            />
          </div>

          <button
            type="submit"
            className="w-full py-3 rounded-full text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 shadow-sm transition-all hover:opacity-90"
            style={{
              backgroundColor: activeTheme.accent,
              color: activeTheme.accentText,
            }}
          >
            <Check className="w-4 h-4" />
            {initialTask ? 'Simpan Perubahan Tugas' : 'Simpan Tugas Baru'}
          </button>
        </form>
      );
    }

            <div>

                {DAYS_OF_WEEK.map((d) => (
                  <button
                    key={d}

                            backgroundColor: activeTheme.accent,

                            backgroundColor: activeTheme.subBg,
                            color: activeTheme.textSecondary,

                ))}
              </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-extrabold mb-1.5">Jam Mulai</label>
                <input
                  type="time"
                  value={startTime}
                  onChange={(e) => setStartTime(e.target.value)}

                  style={{ color: activeTheme.textMuted }}
                >
                  <FileText className="w-3.5 h-3.5" style={{ color: activeTheme.accent }} />
                  Poin Penting Kuliah
                </p>
                <div
                  className="space-y-1 text-xs font-medium leading-relaxed"
                  style={{ color: activeTheme.textSecondary }}
                >
                  {noteLines.map((line, i) => (
                    <p key={i}>{line}</p>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Footer Tautan & Aksi Edit/Hapus */}
          <div
            className="pt-3 border-t flex items-center justify-between gap-2 flex-wrap"
            style={{ borderColor: activeTheme.border }}
          >
            <div className="flex items-center gap-2 flex-wrap">
              {material?.link ? (
                <>
                  <a
                    href={material.link}
                    target="_blank"
                    rel="noreferrer"
                    className="px-4 py-2 rounded-full bg-[#1DB954] hover:opacity-90 text-[#121212] text-xs font-extrabold inline-flex items-center gap-1.5 transition-all"
                  >
                    <ExternalLink className="w-3.5 h-3.5" />
                    Buka Materi
                  </a>
                  <button
                    type="button"
                    onClick={() => onCopyLink(material.link)}
                    className="px-3.5 py-2 rounded-full border text-xs font-bold inline-flex items-center gap-1.5 transition-all"
                    style={{
                      backgroundColor: activeTheme.subBg,
                      borderColor: activeTheme.border,
                      color: activeTheme.textSecondary,
                    }}
                  >
                    {copiedText === material.link ? (
                      <>
                        <Check className="w-3.5 h-3.5 text-[#1DB954]" />
                        Tersalin
                      </>
                    ) : (
                      <>
                        <Copy className="w-3.5 h-3.5" />
                        Salin Link
                      </>
                    )}
                  </button>
                </>
              ) : (
                <span
                  className="text-xs font-semibold"
                  style={{ color: activeTheme.textMuted }}
                >
                  Catatan ringkas tanpa tautan eksternal
                </span>
              )}
            </div>

            <div className="flex items-center gap-1">
              <button
                type="button"
                onClick={() => onEdit(material)}
                className="p-2 rounded-full transition-all hover:opacity-80"
                style={{ color: activeTheme.textMuted }}
                title="Edit Materi"
              >
                <Edit3 className="w-4 h-4" />
              </button>
              <button
                type="button"
                onClick={() => onDelete(material.id)}
                className="p-2 rounded-full hover:bg-rose-500/10 text-rose-500 transition-all"
                title="Hapus Materi"
              >
                <Trash2 className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // SUB-KOMPONEN 5: MODAL FORM TAMBAH / EDIT MATERI KULIAH (FASE 3)
    // ============================================================================

    function MaterialFormModal({
      courses = [],
      initialData,
      defaultCourseId,
      activeTheme,
      onClose,
      onSave,
    }) {
      const safeCourses =
        Array.isArray(courses) && courses.length > 0 ? courses : [FALLBACK_COURSE];
      const [title, setTitle] = useState(initialData?.title || '');
      const [meetingNumber, setMeetingNumber] = useState(initialData?.meetingNumber || 1);
      const [courseId, setCourseId] = useState(
        initialData?.courseId || defaultCourseId || safeCourses[0]?.id || ''
      );
      const [link, setLink] = useState(initialData?.link || '');
      const [notes, setNotes] = useState(initialData?.notes || '');
      const [error, setError] = useState('');

      const inputStyle = {
        backgroundColor: activeTheme.subBg,
        borderColor: activeTheme.border,
        color: activeTheme.textPrimary,
      };

      const selectedCourse = safeCourses.find((c) => c.id === courseId) || safeCourses[0];
      const theme = getCourseTheme(selectedCourse);
      const detectedPlatform = detectMaterialPlatform(link);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) {
          setError('Judul materi kuliah wajib diisi ya!');
          return;
        }
        let normalizedLink = link.trim();
        if (normalizedLink && !/^https?:\/\//i.test(normalizedLink)) {
          normalizedLink = `https://${normalizedLink}`;
        }
        setError('');
        onSave({
          id: initialData?.id,
          title: title.trim(),
          meetingNumber: Math.max(1, Math.min(16, Number(meetingNumber) || 1)),
          courseId,
          link: normalizedLink,
          notes: notes.trim(),
        });
      };

      return (
        <ModalWrapper activeTheme={activeTheme} onClose={onClose}>
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-lg font-extrabold">
              {initialData?.id ? 'Edit Materi Kuliah ✏️' : 'Tambah Materi Kuliah 📚'}
            </h3>
            <button
              onClick={onClose}
              className="p-1.5 rounded-full border"
              style={inputStyle}
            >
              <X className="w-4 h-4" />
            </button>
          </div>

          <div
            className="px-4 py-3 rounded-2xl border mb-4 flex items-center justify-between gap-2"
            style={{
              backgroundColor: theme.bg,
              borderColor: theme.border,
              color: theme.text,
            }}
          >
            <div className="min-w-0">
              <p className="text-[11px] font-extrabold uppercase opacity-80">
                Folder {selectedCourse?.code}
              </p>
              <p className="text-xs sm:text-sm font-extrabold truncate">{selectedCourse?.name}</p>
            </div>
            <span className="px-3 py-1 rounded-full bg-white/95 text-xs font-extrabold shrink-0">
              Pertemuan {meetingNumber}
            </span>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4">
            {error && (
              <div className="p-3 rounded-2xl bg-rose-500/15 text-rose-500 text-xs font-bold flex items-center gap-2">
                <AlertCircle className="w-4 h-4 shrink-0" />
                {error}
              </div>
            )}

            <div>
              <label className="block text-xs font-extrabold mb-1.5">Judul Materi</label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="Misal: State Management & Custom Hooks"
                className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
                style={inputStyle}
              />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-extrabold mb-1.5">Pilih Mata Kuliah</label>
                <select
                  value={courseId}
                  onChange={(e) => setCourseId(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
                  style={inputStyle}
                >
                  {safeCourses.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.code} — {c.name}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-extrabold mb-1.5">
                  Pertemuan Ke- (1–16)
                </label>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    min="1"
                    max="16"
                    value={meetingNumber}
                    onChange={(e) => setMeetingNumber(e.target.value)}
                    className="w-20 px-3 py-2.5 rounded-2xl border text-sm font-extrabold shrink-0"
                    style={inputStyle}
                  />
                  <div className="flex items-center gap-1 overflow-x-auto pb-1">
                    {[1, 2, 3, 4, 5, 6, 7, 8].map((num) => (
                      <button
                        key={num}
                        type="button"
                        onClick={() => setMeetingNumber(num)}
                        className="w-7 h-7 rounded-full text-xs font-extrabold shrink-0 transition-all"
                        style={
                          Number(meetingNumber) === num
                            ? {
                                backgroundColor: activeTheme.accent,
                                color: activeTheme.accentText,
                              }
                            : {
                                backgroundColor: activeTheme.subBg,
                                color: activeTheme.textSecondary,
                              }
                        }
                      >
                        {num}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="text-xs font-extrabold">
                  Link Materi (Google Drive / Notion / YouTube)
                </label>
                {link.trim() && (
                  <span
                    className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold"
                    style={{ backgroundColor: detectedPlatform.bg, color: detectedPlatform.text }}
                  >
                    Terdeteksi: {detectedPlatform.label}
                  </span>
                )}
              </div>
              <input
                type="text"
                value={link}
                onChange={(e) => setLink(e.target.value)}
                placeholder="https://drive.google.com/... atau https://notion.so/..."
                className="w-full px-4 py-2.5 rounded-2xl border focus:outline-none text-sm font-semibold"
                style={inputStyle}
              />
            </div>

            <div>
              <label className="block text-xs font-extrabold mb-1.5">
                Catatan Ringkas / Poin Penting Kuliah
              </label>
              <textarea
                rows={4}
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="Tulis rangkuman rumus, konsep penting, atau kisi-kisi UTS/UAS..."
                className="w-full px-4 py-3 rounded-2xl border focus:outline-none text-xs sm:text-sm font-medium leading-relaxed"
                style={inputStyle}
              />
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2.5 rounded-full border text-xs font-extrabold"
                style={inputStyle}
              >
                Batal
              </button>
              <button
                type="submit"
                className="px-6 py-2.5 rounded-full text-xs font-extrabold flex items-center gap-1.5 shadow-sm"
                style={{
                  backgroundColor: activeTheme.accent,
                  color: activeTheme.accentText,
                }}
              >
                <Check className="w-4 h-4" />
                Simpan Materi
              </button>
            </div>
          </form>
        </ModalWrapper>
      );
    }

    // ============================================================================
    // SUB-KOMPONEN 6: MODAL WRAPPER RESPONSIF (MENDUKUNG 4 PRESET TEMA)
    // ============================================================================

    function ModalWrapper({ children, onClose, activeTheme }) {
      useEffect(() => {
        const handleEsc = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleEsc);
        return () => window.removeEventListener('keydown', handleEsc);
      }, [onClose]);

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full max-w-lg rounded-3xl p-6 shadow-2xl border max-h-[90vh] overflow-y-auto pk-animate-in"
            style={{
              backgroundColor: activeTheme?.cardBg || '#FFFFFF',
              borderColor: activeTheme?.border || '#E2E8F0',
              color: activeTheme?.textPrimary || '#18181B',
            }}
          >
            {children}
          </div>
        </div>
      );
    }

    // ============================================================================
    // 9. RENDER ROOT APLIKASI KE DOM
    // ============================================================================

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
