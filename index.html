    function createLucideIcon(iconName) {
      return function LucideIcon({ size = 18, strokeWidth = 2.1, className = '', ...props }) {
        const iconNodes = window.lucide?.icons?.[iconName];
        if (!Array.isArray(iconNodes)) {
          return (
            <svg
              width={size}
              height={size}
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth={strokeWidth}
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <circle cx="12" cy="12" r="9" />
            </svg>
          );
        }
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth={strokeWidth}
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            {...props}
          >
            {iconNodes.map(([tag, attrs], index) =>
              React.createElement(tag, { ...attrs, key: index })
            )}
          </svg>
        );
      };
    }

    function safeLoadArray(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeLoadObject(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed)
          ? { ...fallback, ...parsed }
          : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function playGentleDing() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const playNote = (freq, startOffset, duration, peakGain) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + startOffset);

          gain.gain.setValueAtTime(0.0001, now + startOffset);
          gain.gain.exponentialRampToValueAtTime(peakGain, now + startOffset + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + startOffset);
          osc.stop(now + startOffset + duration);
        };

        playNote(1046.5, 0, 0.55, 0.14);
        playNote(1318.5, 0.14, 0.75, 0.12);
      } catch (e) {}
    }

    function buildGoogleCalendarUrl({ title, startDate, endDate, details = '', location = '' }) {
      const toGCalDate = (dateObj) => {
        const pad = (n) => String(n).padStart(2, '0');
        return (
          dateObj.getUTCFullYear() +
          pad(dateObj.getUTCMonth() + 1) +
          pad(dateObj.getUTCDate()) +
          'T' +
          pad(dateObj.getUTCHours()) +
          pad(dateObj.getUTCMinutes()) +
          pad(dateObj.getUTCSeconds()) +
          'Z'
        );
      };

      const start = startDate instanceof Date && !isNaN(startDate) ? startDate : new Date(Date.now() + 3600000);
      const end =
        endDate instanceof Date && !isNaN(endDate)
          ? endDate
          : new Date(start.getTime() + 60 * 60 * 1000);

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title || 'Pengingat PangKuliah',
        dates: `${toGCalDate(start)}/${toGCalDate(end)}`,
        details: details || 'Dijadwalkan melalui aplikasi PangKuliah.',
        location: location || '',
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function getNextOccurrenceForDay(dayName, timeStr) {
      const targetDay = ALL_DAYS.indexOf(dayName);
      const safeTarget = targetDay >= 0 ? targetDay : 1;
      const [hh, mm] = (timeStr || '08:00').split(':').map(Number);
      const now = new Date();
      const result = new Date(now);
      const diff = (safeTarget - now.getDay() + 7) % 7;
      result.setDate(now.getDate() + diff);
      result.setHours(hh || 8, mm || 0, 0, 0);
      if (result < now && diff === 0) {
        result.setDate(result.getDate() + 7);
      }
      return result;
    }

    function detectPlatform(url = '') {
      const lower = url.toLowerCase();
      if (lower.includes('drive.google') || lower.includes('docs.google')) return { label: 'Google Drive', icon: FileText };
      if (lower.includes('notion.so') || lower.includes('notion.site')) return { label: 'Notion', icon: BookOpen };
      if (lower.includes('youtube.com') || lower.includes('youtu.be')) return { label: 'YouTube', icon: Youtube };
      if (lower.includes('figma.com')) return { label: 'Figma', icon: Palette };
      return { label: 'Tautan Materi', icon: Link2 };
    }

    function formatDeadlineLabel(isoStr) {
      if (!isoStr) return 'Tanpa tenggat';
      const target = new Date(isoStr);
      if (isNaN(target)) return isoStr;
      const diffMs = target - new Date();
      const diffMins = Math.round(diffMs / 60000);
      const timePart = target.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const datePart = target.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

      if (diffMins < 0) return `Terlewat (${datePart}, ${timePart})`;
      if (diffMins < 60) return `${diffMins} menit lagi (${timePart})`;
      const diffHours = Math.round(diffMins / 60);
      if (diffHours < 24) return `${diffHours} jam lagi (${timePart})`;
      const diffDays = Math.round(diffHours / 24);
      if (diffDays === 1) return `Besok, ${timePart}`;
      return `${datePart}, ${timePart}`;
    }

      );
      const alertedIdsRef = useRef(new Set());

      // Default langsung ke Real-Time mengikuti jam & hari perangkat saat ini
      const [clockMode, setClockMode] = useState('realtime');
      const [nowTick, setNowTick] = useState(() => new Date());

      const initialRealDay = ALL_DAYS[new Date().getDay()];
      const [selectedDay, setSelectedDay] = useState(() =>
        DAYS.includes(initialRealDay) ? initialRealDay : 'Senin'
      );
      const [taskCourseFilter, setTaskCourseFilter] = useState('all');
      const [taskStatusFilter, setTaskStatusFilter] = useState('all');
      const [celebratingTaskId, setCelebratingTaskId] = useState(null);
      const [materialSearch, setMaterialSearch] = useState('');
      const [selectedFolderCourseId, setSelectedFolderCourseId] = useState('all');

      const [detailSchedule, setDetailSchedule] = useState(null);
      const [scheduleModalOpen, setScheduleModalOpen] = useState(false);
      const [editingSchedule, setEditingSchedule] = useState(null);
      const [courseModalOpen, setCourseModalOpen] = useState(false);
      const [editingCourse, setEditingCourse] = useState(null);
      const [materialModalOpen, setMaterialModalOpen] = useState(false);
      const [editingMaterial, setEditingMaterial] = useState(null);
      const [toastMsg, setToastMsg] = useState('');
      const [copiedText, setCopiedText] = useState('');

      useEffect(() => {
        localStorage.setItem('pangkuliah_theme', themeKey);
      }, [themeKey]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_profile', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_courses', JSON.stringify(courses));
      }, [courses]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_schedules', JSON.stringify(schedules));
      }, [schedules]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_materials', JSON.stringify(materials));
      }, [materials]);

      useEffect(() => {
        localStorage.setItem('pangkuliah_reminders', String(remindersEnabled));
      }, [remindersEnabled]);

      // Update jam real-time setiap 1 detik
      useEffect(() => {
        const timer = setInterval(() => {
          setNowTick(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg((prev) => (prev === msg ? '' : prev));
        }, 3200);
      };

      const handleCopy = (text, label = 'Teks') => {
        if (!text) return;
        navigator.clipboard?.writeText(text);
        setCopiedText(text);
        showToast(`${label} berhasil disalin!`);
        setTimeout(() => setCopiedText(''), 2000);
      };

      const handleEnableReminders = async () => {
        setRemindersEnabled(true);
        playGentleDing();

        if (typeof Notification === 'undefined') {
          showToast('Suara pengingat aktif! Browser ini tidak mendukung pop-up sistem.');
          return;
        }

        if (Notification.permission === 'granted') {
          setNotifPermission('granted');
          new Notification('PangKuliah — Pengingat Aktif! 🔔', {
            body: 'Kamu akan mendapat notifikasi & suara ding saat tugas atau kelas mendekat.',
          });
          showToast('Pengingat & suara ding aktif!');
          return;
        }

        if (Notification.permission !== 'denied') {
          const perm = await Notification.requestPermission();
          setNotifPermission(perm);
          if (perm === 'granted') {
            new Notification('PangKuliah — Notifikasi Diizinkan! 🎉', {
              body: 'Pengingat tugas & jadwal kuliah siap menemani harimu.',
            });
            showToast('Izin notifikasi diberikan! Suara ding aktif.');
          } else {
            showToast('Suara pengingat dalam aplikasi tetap aktif!');
          }
        } else {
          showToast('Izin notifikasi diblokir browser, suara ding dalam aplikasi tetap aktif.');
        }
      };

      const getCourse = (courseId) =>
        (courses || []).find((c) => c.id === courseId) || {
          id: 'unknown',
          code: 'MK',
          name: 'Mata Kuliah Umum',
          lecturer: 'Dosen Pengampu',
          sks: 2,
          color: 'lavender',
        };

      const getPastel = (colorKey) => PASTEL_THEMES[colorKey] || PASTEL_THEMES.lavender;

      // Informasi Hari & Jam Real-Time dari Perangkat
      const realDayIdx = nowTick.getDay();
      const realDayName = ALL_DAYS[realDayIdx];
      const formattedRealDate = nowTick.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'short',
        year: 'numeric',
      });
      const formattedRealClock = nowTick.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });

      // Kalkulasi Hero Card "Now Playing" (Real-Time Akurat + Mode Simulasi)
      const heroSessionInfo = useMemo(() => {
        const list = schedules || [];
        if (list.length === 0) return null;

        // Mode Simulasi untuk uji coba tampilan
        if (clockMode === 'sim_active' || clockMode === 'sim_upcoming') {
          const targetItem = list[0];
          const [sh, sm] = (targetItem.startTime || '08:00').split(':').map(Number);
          const [eh, em] = (targetItem.endTime || '10:00').split(':').map(Number);
          const startTotal = sh * 60 + sm;
          const endTotal = eh * 60 + em;
          const currentSecs = nowTick.getSeconds();

          if (clockMode === 'sim_active') {
            const currentMins = startTotal + 35;
            const totalDuration = Math.max(1, endTotal - startTotal);
            const elapsed = currentMins - startTotal + currentSecs / 60;
            const progress = Math.min(100, Math.max(4, Math.round((elapsed / totalDuration) * 100)));
            const remainMins = Math.max(0, endTotal - currentMins - 1);
            const remainSecs = 59 - currentSecs;
            return {
              status: 'active',
              schedule: targetItem,
              course: getCourse(targetItem.courseId),
              progress,
              countdown: `${String(remainMins).padStart(2, '0')}:${String(remainSecs).padStart(2, '0')} tersisa`,
              dayLabel: `Simulasi (${targetItem.day})`,
            };
          } else {
            const diffMins = 14;
            const diffSecs = 59 - currentSecs;
            return {
              status: 'upcoming',
              schedule: targetItem,
              course: getCourse(targetItem.courseId),
              progress: 72,
              countdown: `Mulai dalam ${diffMins}m ${String(diffSecs).padStart(2, '0')}d`,
              dayLabel: `Simulasi (${targetItem.day})`,
            };
          }
        }

        // MODE REAL-TIME: Cek jadwal hari ini terlebih dahulu
        const currentMins = nowTick.getHours() * 60 + nowTick.getMinutes();
        const currentSecs = nowTick.getSeconds();

        const todayList = list
          .filter((s) => s.day === realDayName)
          .sort((a, b) => a.startTime.localeCompare(b.startTime));

        for (const item of todayList) {
          const [sh, sm] = item.startTime.split(':').map(Number);
          const [eh, em] = item.endTime.split(':').map(Number);
          const startTotal = sh * 60 + sm;
          const endTotal = eh * 60 + em;

          if (currentMins >= startTotal && currentMins < endTotal) {
            const totalDuration = Math.max(1, endTotal - startTotal);
            const elapsed = currentMins - startTotal + currentSecs / 60;
            const progress = Math.min(100, Math.max(4, Math.round((elapsed / totalDuration) * 100)));
            const remainMins = Math.max(0, endTotal - currentMins - 1);
            const remainSecs = 59 - currentSecs;
            return {
              status: 'active',
              schedule: item,
              course: getCourse(item.courseId),
              progress,
              countdown: `${String(remainMins).padStart(2, '0')}:${String(remainSecs).padStart(2, '0')} tersisa`,
              dayLabel: `Hari Ini (${realDayName})`,
            };
          }

          if (currentMins < startTotal) {
            const diffMins = startTotal - currentMins - 1;
            const diffSecs = 59 - currentSecs;
            const hrs = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            const countdownStr =
              hrs > 0
                ? `Mulai dalam ${hrs}j ${mins}m ${String(diffSecs).padStart(2, '0')}d`
                : `Mulai dalam ${mins}m ${String(diffSecs).padStart(2, '0')}d`;
            return {
              status: 'upcoming',
              schedule: item,
              course: getCourse(item.courseId),
              progress: Math.max(8, 100 - Math.min(92, diffMins)),
              countdown: countdownStr,
              dayLabel: `Hari Ini (${realDayName})`,
            };
          }
        }

        // Jika hari ini tidak ada kelas (misal Minggu) atau semua kelas hari ini sudah selesai,
        // cari kelas berikutnya secara real-time di hari-hari mendatang (1..7 hari ke depan)
        for (let offset = 1; offset <= 7; offset++) {
          const nextDayName = ALL_DAYS[(realDayIdx + offset) % 7];
          const nextDayScheds = list
            .filter((s) => s.day === nextDayName)
            .sort((a, b) => a.startTime.localeCompare(b.startTime));

          if (nextDayScheds.length > 0) {
            const first = nextDayScheds[0];
            const [sh, sm] = first.startTime.split(':').map(Number);
            const targetDate = new Date(nowTick);
            targetDate.setDate(nowTick.getDate() + offset);
            targetDate.setHours(sh || 8, sm || 0, 0, 0);

            const diffMs = Math.max(0, targetDate - nowTick);
            const diffHrs = Math.floor(diffMs / 3600000);
            const diffMins = Math.floor((diffMs % 3600000) / 60000);

            return {
              status: 'next_day',
              schedule: first,
              course: getCourse(first.courseId),
              progress: 0,
              countdown: `${offset === 1 ? 'Besok' : nextDayName}, ${first.startTime} (${diffHrs}j ${diffMins}m lagi)`,
              dayLabel: offset === 1 ? `Besok (${nextDayName})` : nextDayName,
            };
          }
        }

        return null;
      }, [schedules, courses, clockMode, nowTick, realDayName, realDayIdx]);

      const urgentTasks = useMemo(() => {
        return (tasks || [])
          .filter((t) => {
            if (t.completed || !t.deadline) return false;
            const diffHrs = (new Date(t.deadline) - nowTick) / 3600000;
            return diffHrs > -2 && diffHrs <= 24;
          })
          .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
      }, [tasks, nowTick]);

      useEffect(() => {
        if (!remindersEnabled || urgentTasks.length === 0) return;
        const firstUrgent = urgentTasks[0];
        if (!alertedIdsRef.current.has(firstUrgent.id)) {
          alertedIdsRef.current.add(firstUrgent.id);
          playGentleDing();
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            new Notification(`Pengingat Tugas: ${firstUrgent.title}`, {
              body: `Tenggat ${formatDeadlineLabel(firstUrgent.deadline)}`,
            });
          }
        }
      }, [urgentTasks, remindersEnabled]);

      const filteredTasks = useMemo(() => {
        return (tasks || [])
          .filter((t) => (taskCourseFilter === 'all' ? true : t.courseId === taskCourseFilter))
          .filter((t) => {
            if (taskStatusFilter === 'active') return !t.completed;
            if (taskStatusFilter === 'done') return t.completed;
            return true;
          })
          .sort((a, b) => {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            return new Date(a.deadline || 0) - new Date(b.deadline || 0);
          });
      }, [tasks, taskCourseFilter, taskStatusFilter]);

      const filteredMaterials = useMemo(() => {
        const q = materialSearch.trim().toLowerCase();
        return (materials || []).filter((m) => {
          const matchFolder = selectedFolderCourseId === 'all' || m.courseId === selectedFolderCourseId;
          if (!matchFolder) return false;
          if (!q) return true;
          const course = getCourse(m.courseId);
          return (
            (m.title || '').toLowerCase().includes(q) ||
            (m.notes || '').toLowerCase().includes(q) ||
            `pertemuan ${m.meeting}`.includes(q) ||
            (course.name || '').toLowerCase().includes(q) ||
            (course.code || '').toLowerCase().includes(q)
          );
        });
      }, [materials, selectedFolderCourseId, materialSearch, courses]);

      const academicStats = useMemo(() => {
        const totalSks = (courses || []).reduce((acc, c) => acc + (Number(c.sks) || 0), 0);
        const totalTasks = (tasks || []).length;
        const doneTasks = (tasks || []).filter((t) => t.completed).length;
        const completionRate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
        return {
          totalCourses: (courses || []).length,
          totalSks,
          totalTasks,
          doneTasks,
          completionRate,
          totalMaterials: (materials || []).length,
          totalSessions: (schedules || []).length,
        };
      }, [courses, tasks, materials, schedules]);

      const toggleTaskComplete = (taskId) => {
        setTasks((prev) =>
          (prev || []).map((t) => {
            if (t.id !== taskId) return t;
            const nextDone = !t.completed;
            if (nextDone) {
              setCelebratingTaskId(taskId);
              playGentleDing();
              setTimeout(() => setCelebratingTaskId(null), 900);
            }
            return { ...t, completed: nextDone };
          })
        );
      };

      const handleDeleteCourse = (courseId) => {
        if ((courses || []).length <= 1) {
          showToast('Minimal harus ada 1 mata kuliah aktif.');
          return;
        }
        setCourses((prev) => (prev || []).filter((c) => c.id !== courseId));
        setSchedules((prev) => (prev || []).filter((s) => s.courseId !== courseId));
        setTasks((prev) => (prev || []).filter((t) => t.courseId !== courseId));
        setMaterials((prev) => (prev || []).filter((m) => m.courseId !== courseId));
        showToast('Mata kuliah & data terkait berhasil dihapus.');
      };

      const handleResetDemo = () => {
        setProfile(INITIAL_PROFILE);
        setCourses(INITIAL_COURSES);
        setSchedules(INITIAL_SCHEDULES);
        setTasks(INITIAL_TASKS);
        setMaterials(INITIAL_MATERIALS);
        setThemeKey('canva');
        showToast('Data demo PangKuliah berhasil dipulihkan!');
      };

      const cycleTheme = () => {
        const keys = Object.keys(THEME_PRESETS);
        const nextIdx = (keys.indexOf(themeKey) + 1) % keys.length;
        setThemeKey(keys[nextIdx]);
      };

      const navItems = [
        { id: 'beranda', label: 'Beranda', icon: Home },
        { id: 'jadwal', label: 'Jadwal', icon: Calendar },
        { id: 'tugas', label: 'Tugas', icon: CheckSquare, badge: (tasks || []).filter((t) => !t.completed).length },
        { id: 'materi', label: 'Materi Kuliah', icon: FolderOpen },
        { id: 'akun', label: 'Akun Mahasiswa', icon: User },
        { id: 'pengaturan', label: 'Pengaturan', icon: Settings },
      ];

      // Jadwal kuliah khusus untuk hari ini secara real-time (tanpa memalsukan hari lain)
      const todaySchedules = useMemo(() => {
        return (schedules || [])
          .filter((s) => s.day === realDayName)
          .sort((a, b) => a.startTime.localeCompare(b.startTime));
      }, [schedules, realDayName]);

      return (
        <div className={`min-h-screen transition-colors duration-300 ${theme.bgApp} ${theme.textPrimary}`}>
          {toastMsg && (
            <div className="fixed top-5 right-5 z-50 animate-pop">
              <div className="flex items-center gap-2.5 px-4 py-3 rounded-full bg-zinc-900 text-white text-sm font-semibold shadow-xl border border-zinc-700/80">
                <Sparkles size={16} className="text-emerald-400 shrink-0" />
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          <div className="flex max-w-[1440px] mx-auto">
            {/* SIDEBAR DESKTOP */}
            <aside className={`hidden lg:flex flex-col w-72 shrink-0 min-h-screen sticky top-0 border-r p-6 justify-between ${theme.sidebarBg}`}>
              <div>
                <div className="flex items-center justify-between mb-8">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-600 via-indigo-600 to-emerald-400 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-violet-500/25">
                      P
                    </div>
                    <div>
                      <h1 className="text-xl font-extrabold tracking-tight leading-none">
                        Pang<span className="text-violet-500">Kuliah</span>
                      </h1>
                      <p className={`text-xs mt-1 font-medium ${theme.textSecondary}`}>
                        Teman Santai Kampusmu
                      </p>
                    </div>
                  </div>
                </div>

                <nav className="space-y-1.5">
                  {navItems.map((item) => {
                    const Icon = item.icon;
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full flex items-center justify-between px-4 py-3 rounded-full text-sm font-semibold transition-all ${
                          isActive ? theme.navActive : theme.navIdle
                        }`}
                      >
                        <span className="flex items-center gap-3">
                          <Icon size={18} />
                          <span>{item.label}</span>
                        </span>
                        {item.badge > 0 && (
                          <span
                            className={`text-xs px-2 py-0.5 rounded-full font-bold ${
                              isActive
                                ? 'bg-white/25 text-current'
                                : theme.isDark
                                ? 'bg-zinc-800 text-zinc-200'
                                : 'bg-zinc-200/80 text-zinc-700'
                            }`}
                          >
                            {item.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>

              <div className="space-y-3 pt-6">
                <button
                  onClick={cycleTheme}
                  className={`w-full flex items-center justify-between px-4 py-2.5 rounded-full text-xs font-bold border transition ${theme.cardBg} ${theme.cardBorder}`}
                >
                  <span className="flex items-center gap-2">
                    <Palette size={15} className="text-violet-500" />
                    <span>Tema: {theme.name}</span>
                  </span>
                  <span className="flex items-center gap-1">
                    {theme.swatchPreview.map((hex, i) => (
                      <span
                        key={i}
                        className="w-3 h-3 rounded-full border border-zinc-400/50"
                        style={{ backgroundColor: hex }}
                      />
                    ))}
                  </span>
                </button>

                <div
                  onClick={() => setActiveTab('akun')}
                  className={`p-3.5 rounded-3xl cursor-pointer transition flex items-center gap-3 ${theme.subCardBg} ${theme.cardBorder}`}
                >
                  <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-violet-600 to-emerald-400 text-white font-extrabold flex items-center justify-center shrink-0">
                    {(profile.name || 'M').charAt(0).toUpperCase()}
                  </div>
                  <div className="min-w-0">
                    <p className="text-sm font-bold truncate">{profile.name || 'Mahasiswa'}</p>
                    <p className={`text-xs truncate ${theme.textSecondary}`}>
                      Semester {profile.semester || '1'} • {profile.major || 'Kampus'}
                    </p>
                  </div>
                </div>
              </div>
            </aside>

            {/* KONTEN UTAMA */}
            <main className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 pt-5 pb-28 lg:pb-12">
              <header className="flex flex-wrap items-center justify-between gap-3 mb-6">
                <div className="flex items-center gap-2.5 lg:hidden">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-emerald-400 text-white font-extrabold flex items-center justify-center">
                    P
                  </div>
                  <span className="text-lg font-extrabold tracking-tight">
                    Pang<span className="text-violet-500">Kuliah</span>
                  </span>
                </div>

                <div className="hidden sm:block">
                  <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight">
                    Halo, {profile.name || 'Mahasiswa'}! Semester {profile.semester || '1'} 👋
                  </h2>
                  <p className={`text-xs sm:text-sm ${theme.textSecondary}`}>
                    {formattedRealDate} • Pukul <span className="font-bold">{formattedRealClock}</span>
                  </p>
                </div>

                <div className="flex items-center gap-2 ml-auto">
                  <div
                    className={`hidden md:flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-extrabold ${theme.cardBg} ${theme.cardBorder}`}
                  >
                    <Clock size={14} className="text-emerald-500" />
                    <span>{realDayName}, {formattedRealClock}</span>
                  </div>

                  <button
                    onClick={cycleTheme}
                    title="Ganti Tema Tampilan"
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-bold transition ${theme.cardBg} ${theme.cardBorder}`}
                  >
                    <Palette size={15} className="text-violet-500" />
                    <span className="hidden md:inline">{theme.name}</span>
                  </button>

                  <button
                    onClick={handleEnableReminders}
                    className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold transition shadow-sm ${
                      notifPermission === 'granted' && remindersEnabled
                        ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30'
                        : theme.accentBg
                    }`}
                  >
                    <BellRing size={15} />
                    <span>
                      {notifPermission === 'granted' && remindersEnabled
                        ? 'Pengingat Aktif'
                        : 'Aktifkan Pengingat'}
                    </span>
                  </button>
                </div>
              </header>

              <div className="sm:hidden mb-5">
                <h2 className="text-xl font-extrabold tracking-tight">
                  Halo, {profile.name || 'Mahasiswa'}! Semester {profile.semester || '1'} 👋
                </h2>
                <p className={`text-xs mt-0.5 ${theme.textSecondary}`}>
                  {formattedRealDate} • <span className="font-bold">{formattedRealClock}</span>
                </p>
              </div>

              {remindersEnabled && urgentTasks.length > 0 && (
                <div className="mb-6 p-4 rounded-3xl bg-gradient-to-r from-amber-500/15 via-rose-500/15 to-violet-500/15 border border-amber-500/30 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center shrink-0 shadow">
                      <BellRing size={19} />
                    </div>
                    <div>
                      <p className="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                        Pengingat Tenggat Terdekat
                      </p>
                      <p className="text-sm font-bold">
                        {urgentTasks[0].title}{' '}
                        <span className="font-normal opacity-80">
                          — {formatDeadlineLabel(urgentTasks[0].deadline)}
                        </span>
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        playGentleDing();
                        showToast('Ting! Suara pengingat berbunyi.');
                      }}
                      className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-white/80 dark:bg-zinc-800 text-zinc-900 dark:text-white border border-zinc-300/60 dark:border-zinc-700 flex items-center gap-1.5"
                    >
                      <Volume2 size={14} />
                      <span>Tes Ding</span>
                    </button>
                    <button
                      onClick={() => setActiveTab('tugas')}
                      className="px-4 py-1.5 rounded-full text-xs font-bold bg-zinc-900 text-white dark:bg-white dark:text-zinc-900"
                    >
                      Lihat Tugas
                    </button>
                  </div>
                </div>
              )}

              {/* TAB 1: BERANDA */}
              {activeTab === 'beranda' && (
                <div className="space-y-6">

                      )}
                    </div>

                    <div className="flex flex-wrap items-center gap-2 pt-2">
                      <a
                        href={gcalUrl}
                        target="_blank"
                        rel="noreferrer"
                        className={`flex-1 py-2.5 px-4 rounded-full text-xs font-bold text-center inline-flex items-center justify-center gap-1.5 ${theme.accentBg}`}
                      >
                        <CalendarPlus size={15} />
                        <span>Set Alarm di Google Calendar</span>
                      </a>
                    </div>
                  </div>
                );
              })()}
            </ModalWrapper>
          )}

          {/* MODAL TAMBAH / EDIT JADWAL */}
          {scheduleModalOpen && (
            <ScheduleFormModal
              courses={courses}
              initialData={editingSchedule}
              defaultDay={selectedDay}
              theme={theme}
              onClose={() => setScheduleModalOpen(false)}
              onSave={(data) => {
                if (editingSchedule) {
                  setSchedules((prev) =>
                    prev.map((s) => (s.id === editingSchedule.id ? { ...s, ...data } : s))
                  );
                  showToast('Jadwal berhasil diperbarui!');
                } else {
                  setSchedules((prev) => [...(prev || []), { ...data, id: `sch-${Date.now()}` }]);
                  showToast('Jadwal baru ditambahkan!');
                }
                setScheduleModalOpen(false);
              }}
            />
          )}

          {/* MODAL TAMBAH / EDIT MATA KULIAH */}
          {courseModalOpen && (
            <CourseFormModal
              initialData={editingCourse}
              theme={theme}
              onClose={() => setCourseModalOpen(false)}
              onSave={(data) => {
                if (editingCourse) {
                  setCourses((prev) =>
                    prev.map((c) => (c.id === editingCourse.id ? { ...c, ...data } : c))
                  );
                  showToast('Mata kuliah diperbarui & tersinkronisasi!');
                } else {
                  setCourses((prev) => [...(prev || []), { ...data, id: `mk-${Date.now()}` }]);
                  showToast('Mata kuliah baru ditambahkan!');
                }
                setCourseModalOpen(false);
              }}
            />
          )}

          {/* MODAL TAMBAH / EDIT MATERI KULIAH */}
          {materialModalOpen && (
            <MaterialFormModal
              courses={courses}
              initialData={editingMaterial}
              theme={theme}
              onClose={() => setMaterialModalOpen(false)}
              onSave={(data) => {
                if (editingMaterial) {
                  setMaterials((prev) =>
                    prev.map((m) => (m.id === editingMaterial.id ? { ...m, ...data } : m))
                  );
                  showToast('Materi kuliah diperbarui!');
                } else {
                  setMaterials((prev) => [{ ...data, id: `mat-${Date.now()}` }, ...(prev || [])]);
                  showToast('Materi kuliah tersimpan!');
                }
                setMaterialModalOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. KOMPONEN FORM & MODAL PENDUKUNG
    // =========================================================================
    function ModalWrapper({ title, onClose, theme, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-pop">
          <div className={`w-full max-w-lg rounded-3xl p-6 shadow-2xl ${theme.cardBg} ${theme.cardBorder}`}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-extrabold">{title}</h3>
              <button
                onClick={onClose}
                className="p-2 rounded-full hover:bg-zinc-500/15 transition"
              >
                <X size={18} />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function QuickTaskForm({ courses, theme, onAddTask }) {
      const [title, setTitle] = useState('');
      const [courseId, setCourseId] = useState(courses?.[0]?.id || 'mk-1');
      const [deadline, setDeadline] = useState(() => getFutureISO(24));
      const [reminder, setReminder] = useState('1h');

      useEffect(() => {
        if (courses?.length > 0 && !courses.some((c) => c.id === courseId)) {
          setCourseId(courses[0].id);
        }
      }, [courses]);

      const applyPreset = (hours) => {
        setDeadline(getFutureISO(hours));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onAddTask({
          id: `tsk-${Date.now()}`,
          title: title.trim(),
          courseId,
          deadline,
          reminder,
          completed: false,
        });
        setTitle('');
      };

      return (
        <form onSubmit={handleSubmit} className={`rounded-3xl p-5 space-y-4 ${theme.cardBg} ${theme.cardBorder}`}>
          <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="Tulis judul tugas baru... (misal: Resume Bab 4 Jaringan)"
              className={`md:col-span-6 px-4 py-3 rounded-2xl text-sm font-medium border outline-none ${theme.inputBg}`}
              required
            />
            <select
              value={courseId}
              onChange={(e) => setCourseId(e.target.value)}
              className={`md:col-span-3 px-3.5 py-3 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
            >
              {(courses || []).map((c) => (
                <option key={c.id} value={c.id}>
                  {c.name}
                </option>
              ))}
            </select>
            <input
              type="datetime-local"
              value={deadline}
              onChange={(e) => setDeadline(e.target.value)}
              className={`md:col-span-3 px-3.5 py-3 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
              required
            />
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className={`text-xs font-bold mr-1 ${theme.textSecondary}`}>Preset:</span>
              {[
                { label: '3 Jam Lagi', hours: 3 },
                { label: 'Besok', hours: 24 },
                { label: '3 Hari Lagi', hours: 72 },
                { label: 'Minggu Depan', hours: 168 },
              ].map((p) => (
                <button
                  key={p.label}
                  type="button"
                  onClick={() => applyPreset(p.hours)}
                  className={`px-3 py-1 rounded-full text-xs font-bold transition ${theme.accentSoft}`}
                >
                  {p.label}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2 ml-auto">
              <select
                value={reminder}
                onChange={(e) => setReminder(e.target.value)}
                className={`px-3 py-2 rounded-full text-xs font-bold border outline-none ${theme.inputBg}`}
              >
                <option value="1h">Ingatkan 1 Jam Sebelum</option>
                <option value="3h">Ingatkan 3 Jam Sebelum</option>
                <option value="1d">Ingatkan H-1</option>
              </select>

              <button
                type="submit"
                className={`px-5 py-2 rounded-full text-xs font-extrabold flex items-center gap-1.5 ${theme.accentBg}`}
              >
                <Plus size={15} />
                <span>Tambah Tugas</span>
              </button>
            </div>
          </div>
        </form>
      );
    }

    function ScheduleFormModal({ courses, initialData, defaultDay, theme, onClose, onSave }) {
      const [courseId, setCourseId] = useState(initialData?.courseId || courses?.[0]?.id || 'mk-1');
      const [day, setDay] = useState(initialData?.day || defaultDay || 'Senin');
      const [startTime, setStartTime] = useState(initialData?.startTime || '08:00');
      const [endTime, setEndTime] = useState(initialData?.endTime || '10:00');
      const [room, setRoom] = useState(initialData?.room || '');
      const [link, setLink] = useState(initialData?.link || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ courseId, day, startTime, endTime, room: room || 'Ruang Kuliah', link });
      };

      return (
        <ModalWrapper
          title={initialData ? 'Edit Jadwal Kuliah' : 'Tambah Jadwal Kuliah'}
          onClose={onClose}
          theme={theme}
        >
          <form onSubmit={handleSubmit} className="space-y-3.5">
            <div>
              <label className="block text-xs font-bold mb-1">Mata Kuliah</label>
              <select
                value={courseId}
                onChange={(e) => setCourseId(e.target.value)}
                className={`w-full px-4 py-2.5 rounded-2xl text-sm font-medium border outline-none ${theme.inputBg}`}
              >
                {(courses || []).map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.code} — {c.name}
                  </option>
                ))}
              </select>
            </div>

            <div className="grid grid-cols-3 gap-2.5">
              <div>
                <label className="block text-xs font-bold mb-1">Hari</label>
                <select
                  value={day}
                  onChange={(e) => setDay(e.target.value)}
                  className={`w-full px-3 py-2.5 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
                >
                  {DAYS.map((d) => (
                    <option key={d} value={d}>
                      {d}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">Jam Mulai</label>
                <input
                  type="time"
                  value={startTime}
                  onChange={(e) => setStartTime(e.target.value)}
                  className={`w-full px-3 py-2.5 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
                />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">Jam Selesai</label>
                <input
                  type="time"
                  value={endTime}
                  onChange={(e) => setEndTime(e.target.value)}
                  className={`w-full px-3 py-2.5 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold mb-1">Ruangan / Gedung</label>
              <input
                type="text"
                value={room}
                onChange={(e) => setRoom(e.target.value)}
                placeholder="Contoh: Gedung A2 Ruang 301"
                className={`w-full px-4 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                required
              />
            </div>

            <div>
              <label className="block text-xs font-bold mb-1">Link Kelas Online (Opsional)</label>
              <input
                type="url"
                value={link}
                onChange={(e) => setLink(e.target.value)}
                placeholder="https://meet.google.com/..."
                className={`w-full px-4 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
              />
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 rounded-full text-xs font-bold opacity-75"
              >
                Batal
              </button>
              <button
                type="submit"
                className={`px-5 py-2.5 rounded-full text-xs font-extrabold ${theme.accentBg}`}
              >
                Simpan Jadwal
              </button>
            </div>
          </form>
        </ModalWrapper>
      );
    }

    function CourseFormModal({ initialData, theme, onClose, onSave }) {
      const [code, setCode] = useState(initialData?.code || 'IF320');
      const [name, setName] = useState(initialData?.name || '');
      const [lecturer, setLecturer] = useState(initialData?.lecturer || '');
      const [sks, setSks] = useState(initialData?.sks || 3);
      const [color, setColor] = useState(initialData?.color || 'lavender');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          code: code.trim() || 'MK',
          name: name.trim(),
          lecturer: lecturer.trim() || 'Dosen Pengampu',
          sks: Number(sks) || 2,
          color,
        });
      };

      return (
        <ModalWrapper
          title={initialData ? 'Edit Mata Kuliah' : 'Tambah Mata Kuliah Baru'}
          onClose={onClose}
          theme={theme}
        >
          <form onSubmit={handleSubmit} className="space-y-3.5">
            <div className="grid grid-cols-3 gap-2.5">
              <div>
                <label className="block text-xs font-bold mb-1">Kode MK</label>
                <input
                  type="text"
                  value={code}
                  onChange={(e) => setCode(e.target.value)}
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                  required
                />
              </div>
              <div className="col-span-2">
                <label className="block text-xs font-bold mb-1">Nama Mata Kuliah</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Contoh: Pemrograman Mobile"
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                  required
                />
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2.5">
              <div className="col-span-2">
                <label className="block text-xs font-bold mb-1">Nama Dosen</label>
                <input
                  type="text"
                  value={lecturer}
                  onChange={(e) => setLecturer(e.target.value)}
                  placeholder="Nama lengkap beserta gelar"
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">Bobot SKS</label>
                <input
                  type="number"
                  min="1"
                  max="6"
                  value={sks}
                  onChange={(e) => setSks(e.target.value)}
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold mb-2">Pilih Tema Warna Pastel</label>
              <div className="flex flex-wrap gap-2">
                {Object.values(PASTEL_THEMES).map((p) => (
                  <button
                    key={p.id}
                    type="button"
                    onClick={() => setColor(p.id)}
                    className={`px-3.5 py-2 rounded-full text-xs font-bold flex items-center gap-2 border transition ${
                      color === p.id ? 'ring-2 ring-violet-500 border-violet-500' : theme.cardBorder
                    }`}
                  >
                    <span className={`w-3.5 h-3.5 rounded-full ${p.dot}`} />
                    <span>{p.label}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-full text-xs font-bold opacity-75">
                Batal
              </button>
              <button
                type="submit"
                className={`px-5 py-2.5 rounded-full text-xs font-extrabold ${theme.accentBg}`}
              >
                Simpan Mata Kuliah
              </button>
            </div>
          </form>
        </ModalWrapper>
      );
    }

    function MaterialFormModal({ courses, initialData, theme, onClose, onSave }) {
      const [courseId, setCourseId] = useState(initialData?.courseId || courses?.[0]?.id || 'mk-1');
      const [meeting, setMeeting] = useState(initialData?.meeting || 1);
      const [title, setTitle] = useState(initialData?.title || '');
      const [link, setLink] = useState(initialData?.link || '');
      const [notes, setNotes] = useState(initialData?.notes || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onSave({
          courseId,
          meeting: Number(meeting) || 1,
          title: title.trim(),
          link: link.trim(),
          notes: notes.trim(),
        });
      };

      return (
        <ModalWrapper
          title={initialData ? 'Edit Materi Kuliah' : 'Tambah Materi Kuliah'}
          onClose={onClose}
          theme={theme}
        >
          <form onSubmit={handleSubmit} className="space-y-3.5">
            <div className="grid grid-cols-3 gap-2.5">
              <div className="col-span-2">
                <label className="block text-xs font-bold mb-1">Mata Kuliah</label>
                <select
                  value={courseId}
                  onChange={(e) => setCourseId(e.target.value)}
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-xs font-bold border outline-none ${theme.inputBg}`}
                >
                  {(courses || []).map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.name}
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">Pertemuan Ke-</label>
                <input
                  type="number"
                  min="1"
                  max="16"
                  value={meeting}
                  onChange={(e) => setMeeting(e.target.value)}
                  className={`w-full px-3.5 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold mb-1">Judul Materi / Topik</label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="Contoh: Normalisasi Database 1NF - 3NF"
                className={`w-full px-4 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
                required
              />
            </div>

            <div>
              <label className="block text-xs font-bold mb-1">Link Materi (Google Drive / Notion / YouTube)</label>
              <input
                type="url"
                value={link}
                onChange={(e) => setLink(e.target.value)}
                placeholder="https://drive.google.com/..."
                className={`w-full px-4 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
              />
            </div>

            <div>
              <label className="block text-xs font-bold mb-1">Catatan Ringkas / Poin Penting</label>
              <textarea
                rows="3"
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="Tulis rangkuman singkat atau kisi-kisi dari dosen..."
                className={`w-full px-4 py-2.5 rounded-2xl text-sm border outline-none ${theme.inputBg}`}
              />
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-full text-xs font-bold opacity-75">
                Batal
              </button>
              <button
                type="submit"
                className={`px-5 py-2.5 rounded-full text-xs font-extrabold ${theme.accentBg}`}
              >
                Simpan Materi
              </button>
            </div>
          </form>
        </ModalWrapper>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PangKuliahApp />);
  </script>
</body>
</html>
